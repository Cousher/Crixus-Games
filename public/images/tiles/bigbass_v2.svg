<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 696" width="512" height="696">
  <defs>
    <radialGradient id="colSky" cx="50%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#422209"/>
      <stop offset="48%" stop-color="#1d1108"/>
      <stop offset="100%" stop-color="#090705"/>
    </radialGradient>
    <radialGradient id="torchAura" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#ffd966" stop-opacity="0.46"/>
      <stop offset="48%" stop-color="#d4af37" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="darkWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261a0c"/>
      <stop offset="45%" stop-color="#140e08"/>
      <stop offset="100%" stop-color="#070503"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc"/>
      <stop offset="45%" stop-color="#e5bc48"/>
      <stop offset="100%" stop-color="#8a600e"/>
    </linearGradient>
    <linearGradient id="crimsonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd85"/>
      <stop offset="32%" stop-color="#e5a928"/>
      <stop offset="72%" stop-color="#9e1b1f"/>
      <stop offset="100%" stop-color="#45080b"/>
    </linearGradient>
    <linearGradient id="hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2c14"/>
      <stop offset="100%" stop-color="#190e06"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Torchlit Colosseum Night Sky -->
  <rect width="512" height="696" fill="url(#colSky)"/>
  <ellipse cx="256" cy="310" rx="245" ry="230" fill="url(#torchAura)"/>

  <!-- Flooded Colosseum Arches Background -->
  <g fill="#160f08" opacity="0.92">
    <path d="M0 345 L512 345 L512 246 L0 246 Z"/>
  </g>
  <!-- Illuminated Roman Arches -->
  <g>
    <path d="M22 345 L22 284 Q50 258 78 284 L78 345 Z" fill="#2d1a0a"/>
    <path d="M102 345 L102 276 Q134 246 166 276 L166 345 Z" fill="#361f0b"/>
    <path d="M192 345 L192 272 Q226 240 260 272 L260 345 Z" fill="#3d230c"/>
    <path d="M286 345 L286 272 Q320 240 354 272 L354 345 Z" fill="#3d230c"/>
    <path d="M380 345 L380 276 Q412 246 444 276 L444 345 Z" fill="#361f0b"/>
    <path d="M462 345 L462 284 Q484 264 504 284 L504 345 Z" fill="#2d1a0a"/>
  </g>
  <!-- Glowing Braziers inside Arches -->
  <g fill="#ffb84d" opacity="0.55" filter="url(#glow)">
    <ellipse cx="50" cy="314" rx="10" ry="15"/>
    <ellipse cx="134" cy="308" rx="12" ry="18"/>
    <ellipse cx="412" cy="308" rx="12" ry="18"/>
    <ellipse cx="484" cy="314" rx="10" ry="15"/>
  </g>

  <!-- Floating Colosseum Embers -->
  <g filter="url(#glow)">
    <circle cx="80" cy="145" r="3.5" fill="#ffe9a8" opacity="0.85"/>
    <circle cx="430" cy="130" r="4" fill="#ffd966" opacity="0.9"/>
    <circle cx="155" cy="95" r="3" fill="#ff9e44" opacity="0.8"/>
    <circle cx="355" cy="90" r="3.5" fill="#fff4c4" opacity="0.85"/>
    <circle cx="256" cy="70" r="4.5" fill="#ffd966" opacity="0.85"/>
  </g>

  <!-- Obsidian & Molten-Gold Flooded Arena Waters -->
  <rect x="0" y="344" width="512" height="352" fill="url(#darkWater)"/>
  <!-- Shimmering Gold Torch Reflections on Water -->
  <g fill="#d4af37" opacity="0.22">
    <rect x="70" y="362" width="120" height="4" rx="2"/>
    <rect x="310" y="366" width="140" height="4" rx="2"/>
    <rect x="165" y="384" width="185" height="5" rx="2.5"/>
    <rect x="200" y="402" width="110" height="4" rx="2"/>
  </g>

  <!-- Imperial Roman War Galley (Naumachia Fishing Vessel) -->
  <g transform="translate(268, 314)">
    <!-- Hull -->
    <path d="M-136 24 Q-96 62, 122 58 Q156 52, 174 16 L124 16 L94 4 L-100 10 Z" fill="url(#hull)" stroke="url(#gold)" stroke-width="3.5"/>
    <!-- Imperial Gold Trim & Bronze Shields along side -->
    <path d="M-114 34 Q0 46, 148 32" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-58" cy="36" r="10" fill="#8b1118" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="-22" cy="39" r="10" fill="#8b1118" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="14" cy="40" r="10" fill="#8b1118" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="50" cy="39" r="10" fill="#8b1118" stroke="url(#gold)" stroke-width="2.5"/>
    <!-- Golden Ram Prow -->
    <path d="M162 22 C184 -8, 176 -32, 150 -28 C166 -14, 156 2, 142 18" fill="url(#gold)"/>
    <!-- Mast & Crimson Imperial Sail with Gold Laurel -->
    <rect x="-12" y="-114" width="9" height="126" rx="4" fill="#5c3614"/>
    <path d="M-6 -104 Q66 -74, 52 -16 Q0 -26, -6 -20 Z" fill="#8b1118" stroke="url(#gold)" stroke-width="3.5"/>
    <circle cx="22" cy="-58" r="15" fill="none" stroke="#ffe9a8" stroke-width="2.5" stroke-dasharray="5 3"/>
    <!-- Arched Golden Rod & Chain Line -->
    <path d="M-78 12 Q-132 -62, -172 -20" fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M-172 -20 Q-155 125, -42 212" fill="none" stroke="#ffe9a8" stroke-width="2.8" stroke-dasharray="7 5" opacity="0.9"/>
  </g>

  <!-- Glowing Golden Chain-Net Underwater -->
  <g transform="translate(232, 528)" opacity="0.95">
    <path d="M-136 -48 C-146 56, -54 114, 50 102 C126 94, 166 36, 142 -36 C96 -8, -80 -10, -136 -48 Z"
          fill="#d4af37" fill-opacity="0.18" stroke="url(#gold)" stroke-width="3.5"/>
    <g stroke="#ffd966" stroke-width="1.6" opacity="0.52">
      <line x1="-100" y1="-25" x2="-35" y2="88"/>
      <line x1="-50" y1="-20" x2="25" y2="96"/>
      <line x1="10" y1="-18" x2="88" y2="78"/>
      <line x1="70" y1="-22" x2="128" y2="38"/>
      <line x1="-112" y1="22" x2="132" y2="-10"/>
      <line x1="-88" y1="62" x2="136" y2="32"/>
    </g>
  </g>

  <!-- Hero Giant Solid-Gold & Imperial Crimson Crowned Bass -->
  <g transform="translate(250, 492) rotate(-17)" filter="url(#softGlow)">
    <!-- Tail Fin -->
    <path d="M-92 0 L-140 -38 Q-122 0, -140 38 Z" fill="url(#gold)" stroke="#5c3608" stroke-width="2.5"/>
    <!-- Dorsal Fin -->
    <path d="M-46 -40 Q0 -78, 54 -36 Z" fill="url(#gold)" stroke="#5c3608" stroke-width="2.5"/>
    <!-- Body -->
    <path d="M-96 0 C-72 -54, 48 -58, 110 -6 C118 0, 118 8, 108 14 C48 60, -72 54, -96 0 Z"
          fill="url(#crimsonGold)" stroke="url(#gold)" stroke-width="4.5"/>
    <!-- Molten Gold Belly -->
    <path d="M-64 16 C-12 40, 56 36, 94 12 C48 26, -18 28, -64 16 Z" fill="#fff5c8" opacity="0.85"/>
    <!-- Embossed Gold Scales -->
    <g stroke="#fff5c8" stroke-width="2" fill="none" opacity="0.65">
      <path d="M-32 -16 Q-22 -6, -32 4"/>
      <path d="M-8 -20 Q2 -10, -8 0"/>
      <path d="M16 -18 Q26 -8, 16 2"/>
      <path d="M40 -14 Q50 -4, 40 6"/>
    </g>
    <!-- Eye -->
    <circle cx="74" cy="-8" r="9.5" fill="#fff8dc" stroke="#5c3608" stroke-width="2"/>
    <circle cx="77" cy="-8" r="5" fill="#1a0c04"/>
    <circle cx="79" cy="-10" r="1.8" fill="#ffffff"/>
    <!-- Roman Emperor Crown -->
    <path d="M56 -38 L52 -58 L67 -46 L77 -64 L85 -44 L98 -54 L91 -34 Z" fill="url(#gold)" stroke="#5c3608" stroke-width="2"/>
  </g>

  <!-- Golden Roman Coins & Sparks -->
  <g filter="url(#glow)">
    <circle cx="112" cy="456" r="12" fill="url(#gold)" stroke="#5c3608" stroke-width="2"/>
    <circle cx="388" cy="468" r="14" fill="url(#gold)" stroke="#5c3608" stroke-width="2"/>
    <circle cx="162" cy="596" r="10" fill="url(#gold)" stroke="#5c3608" stroke-width="2"/>
    <circle cx="352" cy="602" r="11" fill="url(#gold)" stroke="#5c3608" stroke-width="2"/>
    <circle cx="84" cy="534" r="4.5" fill="#ffe9a8" opacity="0.75"/>
    <circle cx="426" cy="548" r="5" fill="#ffd966" opacity="0.8"/>
  </g>

  <!-- Subtle Gold Wave Shimmer -->
  <path d="M0 354 Q64 338, 128 354 T256 354 T384 354 T512 354 L512 370 Q448 356, 384 370 T256 370 T128 370 T0 370 Z" fill="#d4af37" opacity="0.2"/>

  <!-- Imperial Gold Frame -->
  <rect x="10" y="10" width="492" height="676" rx="18" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
</svg>
