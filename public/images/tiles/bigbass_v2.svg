<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 696" width="512" height="696">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071324"/>
      <stop offset="48%" stop-color="#0d2842"/>
      <stop offset="100%" stop-color="#193b52"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#d4af37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d4b6e"/>
      <stop offset="50%" stop-color="#072b44"/>
      <stop offset="100%" stop-color="#041524"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5c8"/>
      <stop offset="48%" stop-color="#e5bc48"/>
      <stop offset="100%" stop-color="#8a600e"/>
    </linearGradient>
    <linearGradient id="bassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="72%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c3518"/>
      <stop offset="100%" stop-color="#261306"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Night Mediterranean Sky -->
  <rect width="512" height="696" fill="url(#sky)"/>
  <ellipse cx="256" cy="220" rx="240" ry="220" fill="url(#moonGlow)"/>

  <!-- Stars -->
  <g fill="#fff5c8" opacity="0.7">
    <circle cx="72" cy="78" r="2.2"/>
    <circle cx="152" cy="54" r="1.8"/>
    <circle cx="384" cy="64" r="2.4"/>
    <circle cx="440" cy="118" r="1.8"/>
    <circle cx="105" cy="145" r="1.6"/>
    <circle cx="330" cy="112" r="2"/>
  </g>

  <!-- Imperial Golden Moon -->
  <circle cx="256" cy="168" r="68" fill="url(#gold)" opacity="0.88" filter="url(#glow)"/>
  <circle cx="256" cy="168" r="58" fill="#fff4c4" opacity="0.5"/>

  <!-- Distant Colosseum Silhouette on Horizon -->
  <path d="M0 330 L85 330 L85 288 Q105 270 125 288 L125 330 L145 330 L145 284 Q170 264 195 284 L195 330 L512 330 L512 360 L0 360 Z" fill="#0b1e33" opacity="0.85"/>

  <!-- Deep Mediterranean Sea -->
  <rect x="0" y="345" width="512" height="351" fill="url(#seaDeep)"/>
  <!-- Golden Moon Reflection on Water -->
  <g fill="#ffd966" opacity="0.22">
    <rect x="180" y="362" width="152" height="6" rx="3"/>
    <rect x="196" y="380" width="120" height="5" rx="2.5"/>
    <rect x="212" y="398" width="88" height="4" rx="2"/>
  </g>

  <!-- Roman Fishing Galley Boat -->
  <g transform="translate(270, 316)">
    <!-- Hull -->
    <path d="M-132 22 Q-95 62, 118 58 Q154 52, 168 18 L120 18 L92 6 L-98 10 Z" fill="url(#hull)" stroke="url(#gold)" stroke-width="3.5"/>
    <!-- Gold Imperial Trim -->
    <path d="M-112 32 Q0 44, 146 32" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <!-- Curved Roman Prow Crest -->
    <path d="M158 22 C178 -8, 172 -30, 148 -28 C162 -16, 152 0, 138 18" fill="url(#gold)"/>
    <!-- Mast & Crimson Sail -->
    <rect x="-12" y="-110" width="9" height="122" rx="4" fill="#6b4118"/>
    <path d="M-6 -100 Q58 -72, 46 -18 Q0 -26, -6 -22 Z" fill="#991b1b" stroke="url(#gold)" stroke-width="3"/>
    <!-- Golden Laurel on Sail -->
    <circle cx="20" cy="-58" r="14" fill="none" stroke="#ffe9a8" stroke-width="2.5" stroke-dasharray="5 3"/>
    <!-- Fishing Rod Arching Out -->
    <path d="M-76 12 Q-130 -64, -172 -24" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <!-- Golden Fishing Line down to Net -->
    <path d="M-172 -24 Q-155 120, -40 210" fill="none" stroke="#ffe9a8" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.85"/>
  </g>

  <!-- Glowing Golden Underwater Net -->
  <g transform="translate(230, 525)" opacity="0.92">
    <path d="M-135 -48 C-145 55, -55 112, 48 102 C125 94, 165 36, 142 -36 C95 -8, -80 -10, -135 -48 Z"
          fill="#d4af37" fill-opacity="0.16" stroke="url(#gold)" stroke-width="3.5"/>
    <!-- Net Diamond Mesh -->
    <g stroke="#ffd966" stroke-width="1.6" opacity="0.5">
      <line x1="-100" y1="-25" x2="-35" y2="88"/>
      <line x1="-50" y1="-20" x2="25" y2="96"/>
      <line x1="10" y1="-18" x2="88" y2="78"/>
      <line x1="70" y1="-22" x2="128" y2="38"/>
      <line x1="-112" y1="22" x2="132" y2="-10"/>
      <line x1="-88" y1="62" x2="136" y2="32"/>
    </g>
  </g>

  <!-- Hero Giant Golden-Emerald Big Bass Leaping! -->
  <g transform="translate(248, 492) rotate(-18)" filter="url(#glow)">
    <!-- Tail Fin -->
    <path d="M-92 0 L-138 -36 Q-122 0, -138 36 Z" fill="url(#gold)" stroke="#064e3b" stroke-width="2.5"/>
    <!-- Dorsal Fin -->
    <path d="M-45 -40 Q0 -76, 52 -36 Z" fill="url(#gold)" stroke="#064e3b" stroke-width="2.5"/>
    <!-- Body -->
    <path d="M-95 0 C-72 -52, 46 -56, 108 -6 C116 0, 116 8, 106 14 C46 58, -72 52, -95 0 Z"
          fill="url(#bassBody)" stroke="url(#gold)" stroke-width="4"/>
    <!-- Golden Belly Highlight -->
    <path d="M-64 16 C-12 40, 56 36, 94 12 C48 26, -18 28, -64 16 Z" fill="#fff4c4" opacity="0.72"/>
    <!-- Scales Shimmer -->
    <g stroke="#ffe9a8" stroke-width="1.8" fill="none" opacity="0.55">
      <path d="M-30 -16 Q-20 -6, -30 4"/>
      <path d="M-6 -20 Q4 -10, -6 0"/>
      <path d="M18 -18 Q28 -8, 18 2"/>
      <path d="M40 -14 Q50 -4, 40 6"/>
    </g>
    <!-- Eye -->
    <circle cx="72" cy="-8" r="9.5" fill="#fff7da" stroke="#064e3b" stroke-width="2"/>
    <circle cx="75" cy="-8" r="5" fill="#0f172a"/>
    <circle cx="77" cy="-10" r="1.8" fill="#ffffff"/>
    <!-- Golden Crown on the Big Bass -->
    <path d="M56 -38 L52 -56 L66 -46 L76 -62 L84 -44 L96 -52 L90 -34 Z" fill="url(#gold)" stroke="#5c3d08" stroke-width="2"/>
  </g>

  <!-- Bubbles & Golden Coins Rising Underwater -->
  <g filter="url(#glow)">
    <circle cx="116" cy="456" r="11" fill="url(#gold)" opacity="0.9"/>
    <circle cx="386" cy="468" r="13" fill="url(#gold)" opacity="0.9"/>
    <circle cx="164" cy="596" r="9" fill="url(#gold)" opacity="0.85"/>
    <circle cx="350" cy="602" r="10" fill="url(#gold)" opacity="0.85"/>
    <circle cx="88" cy="534" r="6" fill="#7dd3fc" opacity="0.65"/>
    <circle cx="424" cy="548" r="7" fill="#7dd3fc" opacity="0.65"/>
    <circle cx="305" cy="422" r="5" fill="#bae6fd" opacity="0.7"/>
  </g>

  <!-- Foreground Ocean Waves -->
  <path d="M0 354 Q64 334, 128 354 T256 354 T384 354 T512 354 L512 374 Q448 358, 384 374 T256 374 T128 374 T0 374 Z" fill="#38bdf8" opacity="0.22"/>

  <!-- Luxury Gold Border Frame -->
  <rect x="10" y="10" width="492" height="676" rx="18" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.38"/>
</svg>
